# Publish a GitHub release with the source tarball whenever a version tag
# (for example "1.0") is pushed; the tag's annotation becomes the release note.
# See "Releasing" in README.md.
name: release
on:
  push:
    tags:
      # this is a glob, not a regexp
      - '[0-9]*'
jobs:
  source:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cockpit-project/tasks:latest
      options: --user root
    permissions:
      # create GitHub release
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gh
        run: dnf install -y gh

      # https://github.blog/2022-04-12-git-security-vulnerability-announced/
      - name: Pacify git's permission check
        run: git config --global --add safe.directory /__w/

      - name: Workaround for https://github.com/actions/checkout/pull/697
        run: git fetch --force origin "${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Build release
        run: make dist

      - name: Create a release
        run: |
          set -x

          TAG_VERSION="${GITHUB_REF_NAME}"
          # subject and body only: a signed tag's %(contents) would include the signature
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${TAG_VERSION}" > release-note.txt

          # the tarball is named after the Makefile's VERSION (git describe, annotated tags only);
          # a lightweight tag makes the two differ and the upload fail, which is the right outcome
          gh release create --title "${TAG_VERSION}" --notes-file release-note.txt  \
            "${TAG_VERSION}" \
            "${GITHUB_REPOSITORY#*/}-$(make print-version).tar.xz"
