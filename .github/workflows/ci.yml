name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (build, lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext make

      - name: Install npm dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build
        run: make

      - name: Distribution tarball
        run: make dist

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run eslint

      - name: Stylelint
        run: npm run stylelint

      - name: Unit tests (helpers)
        run: npm run test:unit

      - name: Translation template
        run: make po/oscap.pot

  bridge:
    name: Bridge (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenSCAP and SCAP Security Guide (for the end-to-end test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscap-scanner ssg-base ssg-debian

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest ruff mypy

      - name: Ruff
        run: ruff check src/oscap-bridge.py test-bridge/

      - name: Mypy
        if: matrix.python-version != '3.9'
        run: mypy src/oscap-bridge.py

      - name: Pytest
        run: sudo --preserve-env=PATH env python -m pytest -v

  rpm:
    name: RPM build (Fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      # git first, so the checkout is a real repository and `git describe` versions the build
      - name: Install git
        run: dnf install -y --setopt=install_weak_deps=False git-core

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build tools
        run: >
          dnf install -y --setopt=install_weak_deps=False
          make nodejs npm rpm-build gettext libappstream-glib systemd-rpm-macros
          python3 xz tar jq dnf5-plugins

      - name: Pacify git's permission check
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install npm dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate the spec and install its build requirements
        run: |
          make cockpit-oscap.spec
          dnf builddep -y cockpit-oscap.spec

      - name: Build the RPM
        run: make rpm

      - name: List package contents
        run: rpm -qlp ./*.noarch.rpm

  deb:
    name: Debian package (Debian stable)
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    steps:
      # git first, so the checkout is a real repository and `git describe` versions the build
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build tools
        run: >
          apt-get install -y --no-install-recommends
          make nodejs npm gettext xz-utils python3 jq
          debhelper dpkg-dev fakeroot lintian

      - name: Pacify git's permission check
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install npm dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build the package
        run: make deb

      - name: List package contents
        run: dpkg -c ./*.deb

      - name: Lintian
        run: lintian --fail-on error ./*.deb
